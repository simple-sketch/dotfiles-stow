# Expand HOME at runtime: portable across usernames and Stow checkout paths.
# context.exec splits args on whitespace, not using shell quote rules: keep
# the entire -c expression free of literal spaces. Quotes protect expanded HOME.
# Do not also enable the distribution's unsupervised WirePlumber drop-in.
context.exec = [
    { path = "/bin/sh" args = "-c \"$HOME/.local/bin/wireplumber-supervisor\"" }
]
