# Restart the session manager if it exits (PipeWire context.exec alone does not).
# The Sway audio helper stops this process group on logout.
context.exec = [
    {
        path = "sh"
        args = [ "-c" "exec \"${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/supervise-wireplumber.sh\"" ]
    }
]
