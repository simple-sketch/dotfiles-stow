# Super + left-hold on a Sway title bar: hover 1–9, then release to send.
# See scripts/workspace-drop/README.md. This does NOT replace dragging in content.
exec_always ~/.config/sway/scripts/workspace-drop.sh --daemon

# A normal floating surface is intentional: mouse release bindings do not work
# on layer-shell surfaces. Keep it out of the tiled layout and remove decoration.
for_window [app_id="^sway-workspace-drop$"] floating enable, border none
no_focus [app_id="^sway-workspace-drop$"]

# Mouse bindings target the container under the cursor, including inactive tabs.
# The helper captures the ordered focus event preceding this binding event.
# No marks: adding a mark would re-evaluate unrelated for_window rules.
bindsym $mod+button1 focus; nop workspace-drop:begin; mode "workspace-drop"

# Temporary mode only while selecting. All other default bindings return on exit.
# No synthetic input, no raw input access, no continuous pointer polling.
mode "workspace-drop" {
    bindsym --whole-window --release $mod+button1 nop workspace-drop:release; mode "default"
    bindsym --whole-window --release button1 nop workspace-drop:release; mode "default"
    bindsym --whole-window --release $mod+Shift+button1 nop workspace-drop:release; mode "default"
    bindsym --whole-window --release Shift+button1 nop workspace-drop:release; mode "default"

    bindsym Escape nop workspace-drop:cancel; mode "default"
    bindsym $mod+Escape nop workspace-drop:cancel; mode "default"
    bindsym $mod+Shift+Escape nop workspace-drop:cancel; mode "default"
    bindsym --whole-window $mod+button1+button3 nop workspace-drop:cancel; mode "default"
    bindsym --whole-window button1+button3 nop workspace-drop:cancel; mode "default"
    bindsym --whole-window button3 nop workspace-drop:cancel; mode "default"
}
