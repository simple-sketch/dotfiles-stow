# Super + Shift + title-bar click: open, then click 1–9 to send.
# See scripts/workspace-selector/README.md. This does NOT replace dragging in content.
exec_always ~/.config/sway/scripts/workspace-selector.sh --daemon

# Keep the selector out of the tiled layout and remove decoration.
for_window [app_id="^sway-workspace-selector$"] floating enable, border none
no_focus [app_id="^sway-workspace-selector$"]

# Mouse bindings target the container under the cursor, including inactive tabs.
# The helper captures the ordered focus event preceding this binding event.
# No marks: adding a mark would re-evaluate unrelated for_window rules.
bindsym $mod+Shift+button1 focus; nop workspace-selector:begin; mode "workspace-selector"

# Temporary mode only while selecting. All other default bindings return on exit.
# No synthetic input, no raw input access, no continuous pointer polling.
mode "workspace-selector" {
    bindsym --whole-window $mod+button1 nop workspace-selector:select
    bindsym --whole-window button1 nop workspace-selector:select
    bindsym --whole-window $mod+Shift+button1 nop workspace-selector:select
    bindsym --whole-window Shift+button1 nop workspace-selector:select

    bindsym Escape nop workspace-selector:cancel; mode "default"
    bindsym $mod+Escape nop workspace-selector:cancel; mode "default"
    bindsym $mod+Shift+Escape nop workspace-selector:cancel; mode "default"
    bindsym --whole-window $mod+button1+button3 nop workspace-selector:cancel; mode "default"
    bindsym --whole-window button1+button3 nop workspace-selector:cancel; mode "default"
    bindsym --whole-window button3 nop workspace-selector:cancel; mode "default"
}
