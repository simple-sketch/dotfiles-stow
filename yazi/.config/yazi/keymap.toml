[mgr]
prepend_keymap = [
	{ on = "A", run = "create --dir", desc = "Create a directory" },

	# Vim-like directory history. If <C-i> conflicts with <Tab> because CSI-u
	# is unsupported, use Yazi's built-in keys: H = previous and L = next.
	{ on = "<C-o>", run = "back",    desc = "Previous directory" },
	{ on = "<C-i>", run = "forward", desc = "Next directory" },

	# Enter directories or open the hovered file through Yazi's opener rules.
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
	{ on = "l",       run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
	{ on = "p",       run = "plugin smart-paste", desc = "Paste into the hovered directory or CWD" },
]
